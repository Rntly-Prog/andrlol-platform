# Blueprint для деплоя на Render: https://render.com
# Dashboard → New → Blueprint → подключить репозиторий с этим файлом

databases:
  - name: andrlol-db
    plan: free
    databaseName: andrlol_platform
    user: andrlol

services:
  - type: web
    name: andrlol-platform
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npx prisma db push
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: andrlol-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: YUKASSA_SHOP_ID
        sync: false
      - key: YUKASSA_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
